<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drinky setup</title>
    <style>
      :root { color-scheme: light dark; --blue: #0284c7; }
      body {
        margin: 0; padding: 24px;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { opacity: 0.7; margin: 0 0 16px; }
      label { display: grid; gap: 4px; font-size: 13px; margin-bottom: 12px; }
      input {
        box-sizing: border-box; width: 100%; padding: 9px; font: inherit;
        border-radius: 8px; border: 1px solid #94a3b8;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
      .days { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .days label { display: flex; align-items: center; gap: 4px; margin: 0; }
      .days input { width: auto; }
      button {
        width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0;
        border-radius: 8px; background: var(--blue); color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.5; }
      #msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: #dc2626; }
      #rest { display: none; }
    </style>
  </head>
  <body>
    <h1>💧 Welcome to Drinky</h1>
    <p>Small sips through the day, at random times, on every device at once.</p>

    <form id="f">
      <label>
        Home server address
        <input name="url" type="url" required placeholder="https://your-server:10454" />
      </label>
      <button type="button" id="connect">Connect</button>

      <div id="rest">
        <p style="margin-top: 16px">These settings are shared by all your devices.</p>
        <div class="grid">
          <label>Daily goal (ml)<input name="dailyGoalMl" type="number" min="100" step="100" required /></label>
          <label>One sip (ml)<input name="sipMl" type="number" min="5" step="5" required /></label>
          <label>Remind from<input name="start" type="time" required /></label>
          <label>until<input name="end" type="time" required /></label>
        </div>
        <div class="days" id="days"></div>
        <p id="hint"></p>
        <button id="save">Start drinking</button>
      </div>
      <div id="msg"></div>
    </form>

    <script>
      const { invoke } = window.__TAURI__.core;
      const f = document.getElementById("f");
      const msg = document.getElementById("msg");
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      days.innerHTML = DAYS.map(
        (d, i) => `<label><input type="checkbox" value="${i}" />${d}</label>`,
      ).join("");
      const hhmm = (m) =>
        `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      const toMin = (t) => t.split(":").reduce((h, m) => h * 60 + Number(m));
      let enabled = true;

      function hint() {
        const sips = Math.ceil(f.dailyGoalMl.value / f.sipMl.value);
        const mins = toMin(f.end.value) - toMin(f.start.value);
        document.getElementById("hint").textContent =
          sips > 0 && mins > 0
            ? `About ${sips} reminders a day, roughly every ${Math.round(mins / (sips + 1))} min, at random.`
            : "";
      }
      f.oninput = hint;

      async function connect() {
        msg.textContent = "";
        if (!f.url.reportValidity()) return;
        try {
          const s = await invoke("load_settings", { url: f.url.value });
          f.dailyGoalMl.value = s.dailyGoalMl;
          f.sipMl.value = s.sipMl ?? 50;
          f.start.value = hhmm(s.startMin);
          f.end.value = hhmm(s.endMin);
          enabled = s.enabled;
          for (const c of days.querySelectorAll("input"))
            c.checked = s.days.includes(Number(c.value));
          rest.style.display = "block";
          hint();
        } catch (e) {
          msg.textContent = e;
        }
      }
      document.getElementById("connect").onclick = connect;

      f.onsubmit = async (e) => {
        e.preventDefault();
        msg.textContent = "";
        save.disabled = true;
        try {
          await invoke("finish_setup", {
            url: f.url.value,
            settings: {
              enabled,
              dailyGoalMl: Number(f.dailyGoalMl.value),
              sipMl: Number(f.sipMl.value),
              startMin: toMin(f.start.value),
              endMin: toMin(f.end.value),
              days: [...days.querySelectorAll("input:checked")].map((c) => Number(c.value)),
            },
          });
        } catch (err) {
          msg.textContent = err;
          save.disabled = false;
        }
      };

      invoke("get_server").then((u) => {
        if (u) {
          f.url.value = u;
          connect();
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drinky</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; padding: 24px;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { opacity: 0.7; margin: 0 0 16px; }
      input {
        width: 100%; box-sizing: border-box; padding: 10px; font: inherit;
        border-radius: 8px; border: 1px solid #94a3b8;
      }
      button {
        margin-top: 12px; width: 100%; padding: 10px; font: inherit; font-weight: 600;
        border: 0; border-radius: 8px; background: #0284c7; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>💧 Drinky</h1>
    <p>Address of your Drinky server. Glass size, goal and schedule are set on its web page.</p>
    <form id="f">
      <input id="url" type="url" required placeholder="https://your-server:10454" />
      <button>Save</button>
    </form>
    <script>
      const { invoke } = window.__TAURI__.core;
      invoke("get_server").then((u) => (url.value = u));
      f.onsubmit = (e) => {
        e.preventDefault();
        invoke("set_server", { url: url.value });
      };
    </script>
  </body>
</html>

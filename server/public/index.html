<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Drinky</title>
    <style>
      :root {
        --blue: #0284c7;
        --deep: #075985;
        --bg: #f0f9ff;
        --card: #fff;
        --text: #0c4a6e;
        --muted: #64748b;
        --line: #e0f2fe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #04121f;
          --card: #0b2236;
          --text: #e0f2fe;
          --muted: #94a3b8;
          --line: #12324d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: max(16px, env(safe-area-inset-top)) 16px 32px;
      }
      main {
        max-width: 460px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 28px;
      }
      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
      }
      .big {
        font-size: 44px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .glasses {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
        font-size: 28px;
      }
      .glasses span {
        opacity: 0.2;
      }
      .glasses span.full {
        opacity: 1;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 14px;
        padding: 14px 18px;
        cursor: pointer;
        background: var(--line);
        color: var(--text);
      }
      button.primary {
        background: var(--blue);
        color: #fff;
        width: 100%;
        font-size: 18px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      input {
        font: inherit;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        width: 100%;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .days {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .days label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--text);
      }
      .days input {
        width: auto;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
        padding: 24px;
        background: linear-gradient(160deg, var(--blue), var(--deep));
        color: #fff;
        text-align: center;
      }
      #overlay.on {
        display: flex;
      }
      #overlay .big {
        font-size: 72px;
      }
      #overlay button {
        width: min(320px, 100%);
      }
      #overlay .primary {
        background: #fff;
        color: var(--deep);
      }
      #overlay .ghost {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      #offline {
        display: none;
        color: #dc2626;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>💧 Drinky</h1>
      <div id="offline">Offline, reconnecting…</div>
      <section class="card">
        <div class="big" id="amount">–</div>
        <div class="glasses" id="glasses"></div>
        <div class="muted" id="next"></div>
      </section>
      <button class="primary" id="drink">I drank a glass</button>
      <div class="row">
        <button id="remind">Remind everywhere now</button>
      </div>
      <form class="card" id="settings">
        <div
          class="row"
          style="justify-content: space-between; align-items: center"
        >
          <strong>Settings</strong>
          <label style="display: flex; gap: 6px; align-items: center; flex: 0">
            <input type="checkbox" name="enabled" style="width: auto" /> On
          </label>
        </div>
        <div class="grid" style="margin-top: 12px">
          <label
            >Glass (ml)<input type="number" name="glassMl" min="1"
          /></label>
          <label
            >Daily goal (ml)<input type="number" name="dailyGoalMl" min="1"
          /></label>
          <label
            >Remind every (min)<input type="number" name="intervalMin" min="1"
          /></label>
          <span></span>
          <label>From<input type="time" name="start" /></label>
          <label>To<input type="time" name="end" /></label>
        </div>
        <div class="days" id="days" style="margin: 12px 0"></div>
        <button type="submit" class="primary">Save</button>
      </form>
    </main>

    <div id="overlay">
      <div style="font-size: 64px">💧</div>
      <div style="font-size: 28px; font-weight: 700">Time to drink</div>
      <div class="big" id="ovGlass"></div>
      <div id="ovProgress"></div>
      <button class="primary" data-act="drink">Done ✓</button>
      <button class="ghost" data-act="snooze">Snooze 5 min</button>
      <button class="ghost" data-act="skip">Skip</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const hhmm = (m) =>
        `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      const toMin = (t) => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      };
      const post = (action, body) =>
        fetch(`/api/${action}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        }).then((r) =>
          r.ok ? r.json() : r.json().then((e) => Promise.reject(e.error)),
        );

      $("days").innerHTML = DAYS.map(
        (d, i) => `<label><input type="checkbox" value="${i}" />${d}</label>`,
      ).join("");

      let formLoaded = false;
      function render(st) {
        const s = st.settings;
        const total = Math.ceil(s.dailyGoalMl / s.glassMl);
        const done = Math.floor(st.drankMl / s.glassMl);
        const L = (ml) => (ml / 1000).toFixed(1);
        $("amount").textContent = `${L(st.drankMl)} / ${L(s.dailyGoalMl)} L`;
        $("glasses").innerHTML = Array.from(
          { length: total },
          (_, i) => `<span class="${i < done ? "full" : ""}">🥛</span>`,
        ).join("");
        $("next").textContent =
          st.drankMl >= s.dailyGoalMl
            ? "Goal reached 🎉"
            : st.nextAt
              ? `Next reminder at ${new Date(st.nextAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`
              : "No reminders right now (outside hours or off)";
        $("drink").textContent = `I drank a glass (${s.glassMl} ml)`;
        $("ovGlass").textContent = `${s.glassMl} ml`;
        $("ovProgress").textContent =
          `Glass ${Math.min(done + 1, total)} of ${total} · ${L(st.drankMl)} / ${L(s.dailyGoalMl)} L today`;
        $("overlay").classList.toggle("on", st.active);

        if (!formLoaded) {
          const f = $("settings").elements;
          f.enabled.checked = s.enabled;
          f.glassMl.value = s.glassMl;
          f.dailyGoalMl.value = s.dailyGoalMl;
          f.intervalMin.value = s.intervalMin;
          f.start.value = hhmm(s.startMin);
          f.end.value = hhmm(s.endMin);
          for (const c of $("days").querySelectorAll("input"))
            c.checked = s.days.includes(Number(c.value));
          formLoaded = true;
        }
      }

      function connect() {
        const es = new EventSource("/api/events");
        es.onmessage = (e) => {
          $("offline").style.display = "none";
          render(JSON.parse(e.data));
        };
        es.onerror = () => ($("offline").style.display = "block");
      }
      connect();

      $("drink").onclick = () => post("drink");
      $("remind").onclick = () => post("remind");
      for (const b of document.querySelectorAll("[data-act]"))
        b.onclick = () => post(b.dataset.act);

      $("settings").onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target.elements;
        try {
          await post("settings", {
            enabled: f.enabled.checked,
            glassMl: Number(f.glassMl.value),
            dailyGoalMl: Number(f.dailyGoalMl.value),
            intervalMin: Number(f.intervalMin.value),
            startMin: toMin(f.start.value),
            endMin: toMin(f.end.value),
            days: [...$("days").querySelectorAll("input:checked")].map((c) =>
              Number(c.value),
            ),
          });
          e.submitter.textContent = "Saved ✓";
          setTimeout(() => (e.submitter.textContent = "Save"), 1500);
        } catch (err) {
          alert(`Could not save: ${err}`);
        }
      };
    </script>
  </body>
</html>

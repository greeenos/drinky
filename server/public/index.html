<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Drinky</title>
    <style>
      :root {
        --blue: #0284c7;
        --deep: #075985;
        --bg: #f0f9ff;
        --card: #fff;
        --text: #0c4a6e;
        --muted: #64748b;
        --line: #e0f2fe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #04121f;
          --card: #0b2236;
          --text: #e0f2fe;
          --muted: #94a3b8;
          --line: #12324d;
        }
      }
      html {
        scrollbar-width: none; /* still scrolls, no bar */
      }
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: max(16px, env(safe-area-inset-top)) 16px 32px;
      }
      main {
        max-width: 460px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 28px;
      }
      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
      }
      .big {
        font-size: 44px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .bar {
        height: 12px;
        margin: 12px 0;
        border-radius: 6px;
        background: var(--line);
        overflow: hidden;
      }
      .bar div {
        height: 100%;
        background: var(--blue);
        transition: width 0.4s;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 14px;
        padding: 14px 18px;
        cursor: pointer;
        background: var(--line);
        color: var(--text);
      }
      button.primary {
        background: var(--blue);
        color: #fff;
        width: 100%;
        font-size: 18px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      input {
        font: inherit;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        width: 100%;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .days {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .days label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--text);
      }
      .days input {
        width: auto;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
        padding: 24px;
        background: linear-gradient(160deg, var(--blue), var(--deep));
        color: #fff;
        text-align: center;
      }
      body.overlay main {
        display: none;
      }
      #overlay.on {
        display: flex;
      }
      #overlay .big {
        font-size: 72px;
      }
      #overlay button {
        width: min(320px, 100%);
      }
      #overlay .primary {
        background: #fff;
        color: var(--deep);
      }
      #overlay .ghost {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      .week {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 110px;
        margin-top: 12px;
        position: relative;
      }
      .week .day {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        font-size: 12px;
        color: var(--muted);
      }
      .week .col {
        width: 100%;
        border-radius: 6px 6px 2px 2px;
        background: var(--line);
        margin-bottom: 4px;
      }
      .week .col.hit {
        background: var(--blue);
      }
      #offline {
        display: none;
        color: #dc2626;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>💧 Drinky</h1>
      <div id="offline">Offline, reconnecting…</div>
      <section class="card">
        <div class="big" id="amount">–</div>
        <div class="bar"><div id="bar"></div></div>
        <div class="muted" id="next"></div>
      </section>
      <button class="primary" id="drink">I took a sip</button>
      <div class="row">
        <button data-ml="250">+250 ml glass</button>
        <button data-ml="500">+500 ml bottle</button>
      </div>
      <div class="row">
        <button id="remind">Remind everywhere now</button>
      </div>
      <button id="notify" hidden>
        🔔 Turn on notifications on this device
      </button>
      <div class="muted" id="notifyHint"></div>
      <section class="card">
        <strong>Last 7 days</strong>
        <div class="week" id="week"></div>
      </section>
      <form class="card" id="settings">
        <div
          class="row"
          style="justify-content: space-between; align-items: center"
        >
          <strong>Settings</strong>
          <label style="display: flex; gap: 6px; align-items: center; flex: 0">
            <input type="checkbox" name="enabled" style="width: auto" /> On
          </label>
        </div>
        <div class="grid" style="margin-top: 12px">
          <label
            >One sip (ml)<input type="number" name="sipMl" min="1"
          /></label>
          <label
            >Daily goal (ml)<input type="number" name="dailyGoalMl" min="1"
          /></label>
          <label>From<input type="time" name="start" /></label>
          <label>To<input type="time" name="end" /></label>
        </div>
        <div class="days" id="days" style="margin: 12px 0"></div>
        <button type="submit" class="primary">Save</button>
      </form>
    </main>

    <div id="overlay">
      <div style="font-size: 64px">💧</div>
      <div style="font-size: 28px; font-weight: 700">Take a sip</div>
      <div class="big" id="ovGlass"></div>
      <div id="ovProgress"></div>
      <button class="primary" data-act="drink">Done ✓</button>
      <button class="ghost" data-act="snooze">Snooze 5 min</button>
      <button class="ghost" data-act="skip">Skip</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      // Desktop app opens ?overlay=1 on every monitor while a reminder is due.
      const params = new URLSearchParams(location.search);
      const OVERLAY = params.has("overlay");
      // Inside the desktop app reminders come as the overlay, and its webview
      // can't do web notifications anyway.
      const IN_APP = params.has("app");
      document.body.classList.toggle("overlay", OVERLAY);
      $("overlay").classList.toggle("on", OVERLAY);
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const hhmm = (m) =>
        `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      const toMin = (t) => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      };
      const post = (action, body) =>
        fetch(`/api/${action}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        }).then((r) =>
          r.ok ? r.json() : r.json().then((e) => Promise.reject(e.error)),
        );

      $("days").innerHTML = DAYS.map(
        (d, i) => `<label><input type="checkbox" value="${i}" />${d}</label>`,
      ).join("");

      // Bars for the last 7 days; blue = goal reached (goal = today's goal).
      function renderWeek(st) {
        const goal = st.settings.dailyGoalMl;
        const today = new Date(`${st.date}T12:00:00`);
        const days = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(today - (6 - i) * 86_400_000);
          const key = d.toLocaleDateString("sv-SE");
          const ml = i === 6 ? st.drankMl : (st.history?.[key] ?? 0);
          return { ml, label: i === 6 ? "Today" : DAYS[d.getDay()] };
        });
        const max = Math.max(goal, ...days.map((d) => d.ml));
        $("week").innerHTML = days
          .map(
            (d) =>
              `<div class="day" title="${d.ml} ml"><div class="col ${d.ml >= goal ? "hit" : ""}" style="height:${Math.max(3, (80 * d.ml) / max)}%"></div>${d.label}</div>`,
          )
          .join("");
      }

      // Settings live on the server; refresh the form whenever another
      // device changes them, unless you're editing it right now.
      let shownSettings = "";
      function render(st) {
        const s = st.settings;
        const L = (ml) => (ml / 1000).toFixed(2);
        $("amount").textContent = `${L(st.drankMl)} / ${L(s.dailyGoalMl)} L`;
        $("bar").style.width =
          `${Math.min(100, (100 * st.drankMl) / s.dailyGoalMl)}%`;
        $("next").textContent =
          st.drankMl >= s.dailyGoalMl
            ? "Goal reached 🎉"
            : st.nextAt
              ? `Next reminder at ${new Date(st.nextAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`
              : "No reminders right now (outside hours or off)";
        $("drink").textContent = `I took a sip (+${s.sipMl} ml)`;
        renderWeek(st);
        $("ovGlass").textContent = `~${s.sipMl} ml`;
        $("ovProgress").textContent =
          `${L(st.drankMl)} / ${L(s.dailyGoalMl)} L today`;
        $("overlay").classList.toggle("on", st.active || OVERLAY);

        const json = JSON.stringify(s);
        if (
          json !== shownSettings &&
          !$("settings").contains(document.activeElement)
        ) {
          shownSettings = json;
          const f = $("settings").elements;
          f.enabled.checked = s.enabled;
          f.sipMl.value = s.sipMl;
          f.dailyGoalMl.value = s.dailyGoalMl;
          f.start.value = hhmm(s.startMin);
          f.end.value = hhmm(s.endMin);
          for (const c of $("days").querySelectorAll("input"))
            c.checked = s.days.includes(Number(c.value));
        }
      }

      function connect() {
        const es = new EventSource("/api/events");
        es.onmessage = (e) => {
          $("offline").style.display = "none";
          render(JSON.parse(e.data));
        };
        es.onerror = () => ($("offline").style.display = "block");
      }
      connect();

      // PWA push notifications. On iPhone they need iOS 16.4+ and Drinky
      // opened from the home screen (Share → Add to Home Screen).
      async function setupPush(ask) {
        if (OVERLAY || IN_APP || !("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.register("/sw.js");
        if (!("PushManager" in window)) {
          $("notifyHint").textContent =
            "For notifications on iPhone: Share → Add to Home Screen, then open Drinky from there.";
          return;
        }
        let sub = await reg.pushManager.getSubscription();
        if (!sub && ask) {
          if ((await Notification.requestPermission()) !== "granted") {
            $("notifyHint").textContent =
              "Notifications are blocked in this browser's settings.";
            return;
          }
          const { key } = await fetch("/api/vapid").then((r) => r.json());
          const raw = atob(key.replace(/-/g, "+").replace(/_/g, "/"));
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: Uint8Array.from(raw, (c) => c.charCodeAt(0)),
          });
        }
        if (sub) await post("subscribe", sub.toJSON());
        $("notify").hidden = Boolean(sub);
        $("notifyHint").textContent = sub
          ? "🔔 Notifications are on here."
          : "";
      }
      setupPush(false).catch(() => {});
      $("notify").onclick = () =>
        setupPush(true).catch((e) => ($("notifyHint").textContent = String(e)));

      $("drink").onclick = () => post("drink");
      for (const b of document.querySelectorAll("[data-ml]"))
        b.onclick = () => post("drink", { ml: Number(b.dataset.ml) });
      $("remind").onclick = () => post("remind");
      for (const b of document.querySelectorAll("[data-act]"))
        b.onclick = () => post(b.dataset.act);

      $("settings").onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target.elements;
        try {
          await post("settings", {
            enabled: f.enabled.checked,
            sipMl: Number(f.sipMl.value),
            dailyGoalMl: Number(f.dailyGoalMl.value),
            startMin: toMin(f.start.value),
            endMin: toMin(f.end.value),
            days: [...$("days").querySelectorAll("input:checked")].map((c) =>
              Number(c.value),
            ),
          });
          e.submitter.textContent = "Saved ✓";
          setTimeout(() => (e.submitter.textContent = "Save"), 1500);
        } catch (err) {
          alert(`Could not save: ${err}`);
        }
      };
    </script>
  </body>
</html>
